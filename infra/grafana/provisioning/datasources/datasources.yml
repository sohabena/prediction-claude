# TITAN Grafana Datasources
# Phase 6: Auto-provisioned data sources

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: TimescaleDB
    type: postgres
    url: timescaledb:5432
    database: titan_betting
    user: titan
    secureJsonData:
      password: ${DB_PASSWORD:-titanpassword}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true

