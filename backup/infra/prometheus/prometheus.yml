# TITAN Prometheus Configuration
# Phase 6: Monitoring stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TITAN Backend API
  - job_name: 'titan-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'titan-backend'

  # TITAN Cortex Processor
  - job_name: 'titan-cortex'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cortex:8001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'titan-cortex'

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Custom TITAN metrics endpoint
  - job_name: 'titan-custom'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 30s

