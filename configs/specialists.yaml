# Per-specialist PPO training config (read by scripts/train_format_specialists.py).
# n_steps is the TOTAL rollout size across all envs (per-env steps = n_steps // n_envs).
# Budget: total_timesteps = timesteps_per_match * n_train_matches * epochs_over_data.
defaults:
  gamma: 0.99
  lr: 0.0003
  ent_coef: 0.01
  n_steps: 2048
  batch_size: 64
  n_epochs: 5
  net_arch:
    pi: [256, 256, 128]
    vf: [256, 256, 128]
  timesteps_per_match: 300
  epochs_over_data: 3
  n_envs: 8
  patience: 5

specialists:
  ipl:
    gamma: 0.98
    ent_coef: 0.015
    lr: 0.0003
  bbl_men:
