# TITAN Alert Rules
# Phase 6: Proactive alerting for production reliability

groups:
  - name: titan-critical
    rules:
      # Scraper down for more than 60 seconds
      - alert: ScraperDown
        expr: up{job="titan-cortex"} == 0
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: "TITAN Scraper is DOWN"
          description: "The scraper has been down for more than 60 seconds. No new odds data is being collected."

      # Backend API not responding
      - alert: BackendDown
        expr: up{job="titan-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "TITAN Backend API is DOWN"
          description: "The backend API has been unreachable for more than 30 seconds."

      # Redis connection issues
      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"
          description: "Redis is not responding. All real-time processing is affected."

  - name: titan-performance
    rules:
      # Signal processing latency exceeds 2 seconds
      - alert: HighSignalLatency
        expr: titan_signal_latency_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High signal processing latency"
          description: "Signal processing latency has exceeded 2 seconds for 5 minutes. Edge windows may be missed."

      # Cortex event processing lag
      - alert: EventProcessingLag
        expr: rate(titan_events_processed_total[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low event processing rate"
          description: "Event processing rate is unusually low. Check scraper and data flow."

  - name: titan-risk
    rules:
      # Win rate dropped significantly
      - alert: WinRateDrop
        expr: titan_rolling_win_rate < 0.45
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Win rate has dropped below 45%"
          description: "Rolling win rate has fallen below 45% for 30 minutes. Review strategy performance."

      # Daily loss exceeds threshold
      - alert: DailyLossExceeded
        expr: titan_session_drawdown_percentage < -5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily loss limit exceeded (-5%)"
          description: "Session drawdown has exceeded -5%. Circuit breaker should be triggered."

      # Circuit breaker triggered
      - alert: CircuitBreakerOpen
        expr: titan_circuit_breaker_open == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit Breaker is OPEN"
          description: "The circuit breaker has been triggered. All signal generation is halted."

  - name: titan-data-quality
    rules:
      # High error rate in scraping
      - alert: HighScraperErrorRate
        expr: rate(titan_scraper_errors_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scraper error rate"
          description: "Scraper is experiencing elevated error rates. Data quality may be affected."

      # No signals generated for extended period
      - alert: NoSignalsGenerated
        expr: increase(titan_signals_generated_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No signals generated in 1 hour"
          description: "No betting signals have been generated in the last hour during active hours."

      # Stale odds data
      - alert: StaleOddsData
        expr: time() - titan_last_odds_update_timestamp > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Odds data is stale"
          description: "No new odds data received in over 2 minutes. Check scraper connectivity."

  - name: titan-infrastructure
    rules:
      # High memory usage
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Process memory usage exceeds 500MB for 10 minutes."

      # Redis memory usage high
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / 1024 / 1024 > 256
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis is using more than 256MB of memory."

