    ent_coef: 0.012
    lr: 0.0003
  t20i_men:
    gamma: 0.98
    ent_coef: 0.012
    lr: 0.0003
  t20i_women:
    gamma: 0.98
    ent_coef: 0.012
    lr: 0.0003
  odi_men:
