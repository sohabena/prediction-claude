# TITAN AlertManager Configuration
# Phase 6: Alert routing and notification

global:
  # Slack webhook (configure in environment)
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  resolve_timeout: 5m

# Alert routing
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
    
    # Warning alerts - grouped
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      repeat_interval: 6h

# Notification receivers
receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://backend:8000/api/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#titan-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    webhook_configs:
      - url: 'http://backend:8000/api/alerts/critical'
        send_resolved: true

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#titan-alerts'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules (suppress less severe alerts when critical is firing)
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

