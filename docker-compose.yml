version: '3.8'

# TITAN Betting Intelligence System - Docker Compose
# Phase 6: Production deployment with monitoring

services:
  # ==================== Core Services ====================
  
  redis:
    image: redis:7-alpine
    container_name: titan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: titan-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-titanpassword}
      POSTGRES_DB: titan_betting
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Application Services ====================
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: titan-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://titan:${DB_PASSWORD:-titanpassword}@timescaledb:5432/titan_betting
      - ML_CONFIDENCE_ENABLED=true
      - CLV_TRACKING_ENABLED=true
      - DYNAMIC_KELLY_ENABLED=true
      - ML_DATA_COLLECTION=true
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend/ml/models:/app/backend/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  cortex:
    build:
      context: .
      dockerfile: Dockerfile.cortex
    container_name: titan-cortex
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://titan:${DB_PASSWORD:-titanpassword}@timescaledb:5432/titan_betting
      - ML_CONFIDENCE_ENABLED=true
      - CLV_TRACKING_ENABLED=true
      - DYNAMIC_KELLY_ENABLED=true
      - STARTING_BANKROLL=100000
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/ml/models:/app/backend/ml/models
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: titan-scraper
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPER_HEADLESS=true
      - BETTING_SITE_URL=${BETTING_SITE_URL:-https://www.micro999.co/game/4}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  enricher:
    build:
      context: .
      dockerfile: Dockerfile.enricher
    container_name: titan-enricher
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CRICBUZZ_POLL_INTERVAL=10
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: titan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws
    depends_on:
      - backend
    restart: unless-stopped

  # ==================== Monitoring Stack ====================

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: titan-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: titan-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-titanadmin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: titan-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped

volumes:
  redis_data:
  timescale_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: titan-network

